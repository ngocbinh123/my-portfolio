name: "GitHub Project Ticket Observer"

# ============================================================
# HOOK: Trigger on ALL relevant events
# ============================================================
on:
  # 1. When a new issue is created, edited, assigned, labeled, etc.
  issues:
    types: [opened, edited, assigned, unassigned, labeled, unlabeled, closed, reopened]

  # 2. When project cards change (classic projects)
  project_card:
    types: [created, moved, converted, edited, deleted]

  # 3. When project v2 items change (new GitHub Projects)
  projects_v2_item:
    types: [created, edited, deleted, archived, restored, reordered]

  # 4. Manual trigger for testing
  workflow_dispatch:

# ============================================================
# PERMISSIONS
# ============================================================
permissions:
  issues: read
  contents: read

# ============================================================
# JOB: Analyze ticket and notify Notion
# ============================================================
jobs:
  observe-and-notify:
    runs-on: ubuntu-latest
    steps:
      # ----------------------------------------------------------
      # Step 1: Determine event type and extract ticket info
      # ----------------------------------------------------------
      - name: Extract ticket information
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const event = context.eventName;
            const action = context.payload.action;
            let ticket = {};

            console.log(`Event: ${event}, Action: ${action}`);

            // --- ISSUES EVENT ---
            if (event === 'issues') {
              const issue = context.payload.issue;
              ticket = {
                title: issue.title,
                description: issue.body || 'No description',
                assignee: issue.assignees.map(a => a.login).join(', ') || 'Unassigned',
                status: issue.state === 'open' ? 'Todo' : 'Done',
                url: issue.html_url,
                labels: issue.labels.map(l => l.name).join(', '),
                number: issue.number,
                event_type: action === 'opened' ? 'New' :
                            action === 'assigned' ? 'Assigned' :
                            action === 'closed' ? 'Status Changed' : 'Updated'
              };
            }
            // --- PROJECT V2 ITEM EVENT ---
            else if (event === 'projects_v2_item') {
              const item = context.payload.projects_v2_item;
              // Fetch more details via GraphQL
              const query = `query($nodeId: ID!) {
                node(id: "${item.node_id}") {
                  ... on ProjectV2Item {
                    content {
                      ... on Issue {
                        title
                        body
                        url
                        number
                        state
                        assignees(first: 5) { nodes { login } }
                        labels(first: 10) { nodes { name } }
                      }
                      ... on DraftIssue {
                        title
                        body
                      }
                      ... on PullRequest {
                        title
                        body
                        url
                        number
                        assignees(first: 5) { nodes { login } }
                      }
                    }
                    fieldValues(first: 20) {
                      nodes {
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name
                          field { ... on ProjectV2SingleSelectField { name } }
                        }
                      }
                    }
                  }
                }
              }`;

              try {
                const result = await github.graphql(query, { nodeId: item.node_id });
                const node = result.node;
                const content = node?.content || {};

                // Extract status from project fields
                let projectStatus = 'Unknown';
                if (node?.fieldValues?.nodes) {
                  for (const fv of node.fieldValues.nodes) {
                    if (fv?.field?.name === 'Status') {
                      projectStatus = fv.name;
                      break;
                    }
                  }
                }

                ticket = {
                  title: content.title || 'Draft Issue',
                  description: content.body || 'No description',
                  assignee: content.assignees?.nodes?.map(a => a.login).join(', ') || 'Unassigned',
                  status: projectStatus,
                  url: content.url || '',
                  labels: content.labels?.nodes?.map(l => l.name).join(', ') || '',
                  number: content.number || 0,
                  event_type: action === 'created' ? 'New' :
                              action === 'edited' ? 'Updated' :
                              action === 'archived' ? 'Status Changed' : 'Updated'
                };
              } catch (error) {
                console.log('GraphQL error, using basic info:', error.message);
                ticket = {
                  title: `Project Item #${item.id}`,
                  description: 'Could not fetch details',
                  assignee: 'Unknown',
                  status: 'Unknown',
                  url: '',
                  labels: '',
                  number: 0,
                  event_type: action === 'created' ? 'New' : 'Updated'
                };
              }
            }
            // --- PROJECT CARD EVENT (classic) ---
            else if (event === 'project_card') {
              const card = context.payload.project_card;
              ticket = {
                title: card.note || 'Project Card',
                description: card.note || 'No description',
                assignee: context.payload.sender?.login || 'Unknown',
                status: card.column_name || 'Unknown',
                url: card.content_url || '',
                labels: '',
                number: 0,
                event_type: action === 'created' ? 'New' :
                            action === 'moved' ? 'Status Changed' : 'Updated'
              };
            }
            // --- MANUAL TRIGGER ---
            else {
              ticket = {
                title: 'Manual Test Trigger',
                description: 'This is a test notification from manual workflow dispatch',
                assignee: context.actor,
                status: 'Todo',
                url: `https://github.com/${context.repo.owner}/${context.repo.repo}`,
                labels: 'test',
                number: 0,
                event_type: 'New'
              };
            }

            // Set outputs
            core.setOutput('title', ticket.title);
            core.setOutput('description', ticket.description?.substring(0, 500) || '');
            core.setOutput('assignee', ticket.assignee);
            core.setOutput('status', ticket.status);
            core.setOutput('url', ticket.url);
            core.setOutput('labels', ticket.labels);
            core.setOutput('event_type', ticket.event_type);
            core.setOutput('number', String(ticket.number));

            // Log summary
            console.log('=== TICKET ANALYSIS ===');
            console.log(`Title: ${ticket.title}`);
            console.log(`Assignee: ${ticket.assignee}`);
            console.log(`Status: ${ticket.status}`);
            console.log(`Event: ${ticket.event_type}`);
            console.log(`URL: ${ticket.url}`);

      # ----------------------------------------------------------
      # Step 2: Send notification to Notion
      # ----------------------------------------------------------
      - name: Notify Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: "24954be1216f407eacd03f03f58f45ed"
        run: |
          # Map status to Notion select options
          STATUS="${{ steps.extract.outputs.status }}"
          case "$STATUS" in
            "Todo"|"To Do"|"Triage") NOTION_STATUS="Todo" ;;
            "In Progress"|"In progress") NOTION_STATUS="In Progress" ;;
            "In Review"|"Review") NOTION_STATUS="In Review" ;;
            "Done"|"Closed"|"closed") NOTION_STATUS="Done" ;;
            *) NOTION_STATUS="Backlog" ;;
          esac

          EVENT_TYPE="${{ steps.extract.outputs.event_type }}"
          TITLE="${{ steps.extract.outputs.title }}"
          DESCRIPTION="${{ steps.extract.outputs.description }}"
          ASSIGNEE="${{ steps.extract.outputs.assignee }}"
          URL="${{ steps.extract.outputs.url }}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          # Build JSON payload
          PAYLOAD=$(cat <<EOJSON
          {
            "parent": { "database_id": "${NOTION_DATABASE_ID}" },
            "properties": {
              "Ticket": {
                "title": [{ "text": { "content": "${TITLE}" } }]
              },
              "Status": {
                "select": { "name": "${NOTION_STATUS}" }
              },
              "Assignee": {
                "rich_text": [{ "text": { "content": "${ASSIGNEE}" } }]
              },
              "Event": {
                "select": { "name": "${EVENT_TYPE}" }
              },
              "Description": {
                "rich_text": [{ "text": { "content": "${DESCRIPTION}" } }]
              },
              "GitHub URL": {
                "url": "${URL}"
              },
              "Detected At": {
                "date": { "start": "${NOW}" }
              }
            }
          }
          EOJSON
          )

          # Send to Notion API
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.notion.com/v1/pages" \
            -H "Authorization: Bearer ${NOTION_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            -d "${PAYLOAD}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Successfully created Notion entry for: ${TITLE}"
          else
            echo "❌ Failed to create Notion entry. HTTP ${HTTP_CODE}"
            echo "$BODY"
            exit 1
          fi

      # ----------------------------------------------------------
      # Step 3: Print summary
      # ----------------------------------------------------------
      - name: Print summary
        run: |
          echo "## 🔔 Ticket Observer Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Event** | ${{ steps.extract.outputs.event_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ticket** | ${{ steps.extract.outputs.title }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Assignee** | ${{ steps.extract.outputs.assignee }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ steps.extract.outputs.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${{ steps.extract.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Notion notification sent successfully" >> $GITHUB_STEP_SUMMARY
