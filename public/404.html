<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>my-portfolio</title>
    <!--
      GitHub Pages SPA redirect.
      GitHub Pages serves this 404.html for any unknown path (e.g. a deep link
      like /my-portfolio/about refreshed directly). This script rewrites the URL
      into a query-string form and redirects to the app root, where the decoder
      in index.html restores the original route for React Router.
      pathSegmentsToKeep = 1 keeps the project base path ('/my-portfolio/').
      See: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
